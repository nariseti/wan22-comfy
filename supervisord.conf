[supervisord]
nodaemon=false
logfile=/var/log/supervisord.log

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true

[program:comfyui-gpu0]
command=/venv/main/bin/python /workspace/ComfyUI/main.py --listen 0.0.0.0 --port 18188 --disable-auto-launch
directory=/workspace/ComfyUI
autostart=true
autorestart=true
stdout_logfile=/var/log/comfyui-gpu0.log
stderr_logfile=/var/log/comfyui-gpu0.log
environment=CUDA_VISIBLE_DEVICES="0",PATH="/venv/main/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

